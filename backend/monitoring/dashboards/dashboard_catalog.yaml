version: 1
owner: platform
catalog:
  - id: observability_overview
    metrics:
      - http_request_latency_seconds
      - llm_extraction_latency_seconds
      - llm_schema_error_total
      - ai_token_cost_usd_total
      - cost_per_decision
      - cost_per_successful_explanation
      - cost_by_model_usd
      - cost_by_tenant_usd
      - cost_vs_conversion
      - cost_burn_rate_1h
      - cost_budget_daily_utilization
      - cost_budget_monthly_utilization
